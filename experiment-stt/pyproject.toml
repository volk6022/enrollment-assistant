[project]
name = "experiment-stt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "jiwer>=3.0.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "psutil>=5.9.0",
    "vosk>=0.3.45",
    "omegaconf>=2.3.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
