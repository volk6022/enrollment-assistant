services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dvui_assistant
      POSTGRES_USER: dvui
      POSTGRES_PASSWORD: dvui_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_ENGINE: "auto"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION_LEGAL: "dvui_legal_2025"
      EMBED_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      DATABASE_URL: "postgresql+psycopg://dvui:dvui_pass@postgres:5432/dvui_assistant"
      ADMIN_API_KEY: "change-me-123"
      LLM_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen2.5:3b"
      OLLAMA_NUM_PREDICT: "350"
      OLLAMA_TIMEOUT_SEC: "600"
      OLLAMA_TEMPERATURE: "0.0"
      LEGAL_DOCX_DIR: "/data/npa/2025"
      LEGAL_DOC_REGISTRY_PATH: "/data/npa/2025/document_registry.json"
      CONTACTS_FILE_PATH: "/data/contacts.json"
      YC_FOLDER_ID: "${YC_FOLDER_ID:-}"
      YC_AI_API_KEY: "${YC_AI_API_KEY:-}"
      YANDEX_VECTOR_STORE_ID: "${YANDEX_VECTOR_STORE_ID:-}"
      YANDEXGPT_LITE_MODEL: "yandexgpt-lite/latest"
      YANDEXGPT_PRO_MODEL: "yandexgpt/latest"
      YANDEX_EMBEDDING_MODEL: "text-search-query/latest"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      - qdrant
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  voice-gateway:
    build:
      context: ./services/voice-gateway
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: "http://backend:8000"
      REDIS_URL: "redis://redis:6379/0"
      YC_FOLDER_ID: "${YC_FOLDER_ID:-}"
      YC_SPEECHKIT_API_KEY: "${YC_SPEECHKIT_API_KEY:-}"
      YC_SPEECHKIT_LANG: "ru-RU"
      YC_SPEECHKIT_STT_MODEL: "general"
      YC_TTS_VOICE: "alena"
      YC_TTS_ROLE: "neutral"
      YC_TTS_SPEED: "1.0"
      YC_TTS_FORMAT: "mp3"
      YC_TTS_SAMPLE_RATE_HZ: "48000"
      VOICE_GATEWAY_MODE: "browser-demo"
      VOICE_PUBLIC_BASE_URL: "http://localhost:8010"
      VOICE_CACHE_DIR: "/voice-cache"
      BACKEND_RETRIES: "20"
      BACKEND_RETRY_DELAY_SEC: "1.0"
    ports:
      - "8010:8010"
    volumes:
      - voice_cache:/voice-cache
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  qdrant_storage:
  pgdata:
  voice_cache:
