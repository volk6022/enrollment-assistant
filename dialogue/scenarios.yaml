# Сценарии диалога голосового ассистента приёмной комиссии.
#
# Этот файл редактируется руками — правка сценария НЕ требует правки кода.
# Загружается на старте сервиса (`backend/dialogue/scenarios.py`).
#
# ВАЖНО: словарь условий и действий ниже — ЗАКРЫТЫЙ. Загрузчик падает на старте, если
# сценарий ссылается на неизвестное условие, действие или состояние. Это сделано намеренно:
# опечатка в YAML иначе означала бы сценарий, который молча никогда не сработает.
#
# Состояния берутся из формальной модели specs/formal/dialogue.qnt и должны совпадать с ней
# по написанию: Greeting, Listening, DecidingInterject, Formulating, Speaking,
# DecidingBargeIn, Closing, Ended.
#
# ─────────────────────────────────────────────────────────────────────────────
# СЛОВАРЬ УСЛОВИЙ (другие не существуют)
#
#   intent == "<значение>"      значения: question | clarification_needed | goodbye
#                               | smalltalk | unclear
#                               Источник — ТОЛЬКО IntentDecision из LLM,
#                               см. specs/001-streaming-dialogue/contracts/llm.md §4.3
#   confidence < <число>        уверенность из того же IntentDecision, 0.0–1.0
#   confidence >= <число>
#   rag.count == 0              RAG ничего не вернул
#   rag.max_score < <число>     лучший скор реранкера ниже порога
#   interject_accepted          вердикт InterjectDecision (только в DecidingInterject)
#   bargein_accepted            вердикт BargeInDecision (только в DecidingBargeIn)
#   transcript.empty            whisper вернул пустоту
#   error.type == "<значение>"  значения: timeout | connection_refused | server_error
#
# Условия соединяются через `all:` (И) и `any:` (ИЛИ). Вложенность допустима.
#
# СЛОВАРЬ ДЕЙСТВИЙ (другие не существуют)
#
#   rag_query        — запрос в базу знаний. params: query (=intent.query | transcript)
#   say              — озвучить фиксированный текст. params: text
#   say_generated    — сгенерировать ответ LLM потоком и озвучить.
#                      params: instruction, use_rag (bool)
#   commit_partial   — записать частично озвученный ответ в память (FR-16)
#   resume_speaking  — продолжить прерванное воспроизведение
#   noop             — ничего; используется, когда весь смысл в next_state
#
# ПОДСТАНОВКИ в text: {transcript} {intent.query} {rag.answer} {phone}
# ─────────────────────────────────────────────────────────────────────────────

version: "2.0"
last_modified: 2026-08-01

# Порядок разрешения: среди подходящих сценариев побеждает наибольший priority;
# при равенстве — тот, что выше в файле.
scenarios:

  # ═══════════════════════════════════════════════════════════════════════════
  # Listening — ход собеседника завершён, решаем, что делать
  # ═══════════════════════════════════════════════════════════════════════════

  # Прощание проверяем раньше вопроса: «спасибо, до свидания» не должно уехать в RAG.
  user_says_goodbye:
    enabled: true
    description: "Собеседник прощается или благодарит — закрываем разговор"
    entry_states: [Listening]
    priority: 90
    when:
      all:
        - intent == "goodbye"
        - confidence >= 0.7
    actions:
      - action: say
        params:
          text: "Спасибо, что обратились. Удачи вам на поступлении. До свидания."
    next_state: Closing

  stt_no_speech:
    enabled: true
    description: "Whisper вернул пустоту — переспрашиваем"
    entry_states: [Listening]
    priority: 80
    when:
      all:
        - transcript.empty
    actions:
      - action: say
        params:
          text: "Я вас не расслышал. Повторите, пожалуйста."
    next_state: Listening

  # Уточнение раньше ответа: лучше переспросить, чем уверенно ответить не на то (FR-22).
  clarify_unclear:
    enabled: true
    description: "Намерение непонятно или уверенность низкая — уточняем"
    entry_states: [Listening]
    priority: 70
    when:
      any:
        - intent == "unclear"
        - intent == "clarification_needed"
        - confidence < 0.6
    actions:
      - action: say_generated
        params:
          use_rag: false
          instruction: |
            Ты не понял, о чём спрашивает собеседник. Задай ОДИН короткий уточняющий вопрос.
            Не пересказывай его слова. Не извиняйся дважды. Не предполагай ответ.
            Если из сказанного ясна тема, но не ясен вопрос — уточняй именно вопрос.
    next_state: Listening

  answer_question:
    enabled: true
    description: "Вопрос понятен — ищем в базе знаний и отвечаем"
    entry_states: [Listening]
    priority: 50
    when:
      all:
        - intent == "question"
        - confidence >= 0.6
    actions:
      - action: say
        params:
          text: "Секунду, посмотрю."
      - action: rag_query
        params:
          query: "{intent.query}"
      - action: say_generated
        params:
          use_rag: true
          instruction: |
            Ответь на вопрос собеседника, опираясь ТОЛЬКО на приведённые фрагменты документов.
            Коротко и по делу, разговорным языком — ответ будет озвучен вслух.
            Не перечисляй номера пунктов и названия приказов, если тебя о них не спросили.
            Если во фрагментах нет ответа — так и скажи, не додумывай.
            В конце спроси, нужна ли ещё помощь.
    next_state: Speaking

  smalltalk:
    enabled: true
    description: "Не вопрос по существу — отвечаем коротко и возвращаем к делу"
    entry_states: [Listening]
    priority: 40
    when:
      all:
        - intent == "smalltalk"
    actions:
      - action: say_generated
        params:
          use_rag: false
          instruction: |
            Ответь одной короткой дружелюбной фразой и спроси, что интересует
            по поступлению. Не растягивай.
    next_state: Speaking

  # ═══════════════════════════════════════════════════════════════════════════
  # Formulating — RAG отработал, ответа в базе нет
  # ═══════════════════════════════════════════════════════════════════════════

  no_kb_match:
    enabled: true
    description: "База знаний не дала релевантного — честно говорим и даём маршрут"
    entry_states: [Formulating]
    priority: 90
    when:
      any:
        - rag.count == 0
        - rag.max_score < 0.3
    actions:
      - action: say
        params:
          text: |
            По этому вопросу у меня нет точной информации, и придумывать я не стану.
            Лучше уточнить напрямую в приёмной комиссии: {phone}.
            Могу помочь с чем-то ещё?
    next_state: Speaking

  # ═══════════════════════════════════════════════════════════════════════════
  # DecidingInterject — собеседник говорит дольше DIALOGUE_INTERJECT_AFTER_S
  # ═══════════════════════════════════════════════════════════════════════════

  interject_summarize:
    enabled: true
    description: "LLM решила вмешаться — подводим итог услышанному и идём искать"
    entry_states: [DecidingInterject]
    priority: 50
    when:
      all:
        - interject_accepted
    actions:
      - action: say_generated
        params:
          use_rag: false
          instruction: |
            Собеседник говорит уже долго. Вежливо вклинься: одной фразой скажи,
            что ты понял, и предложи сразу поискать. Не перебивай грубо,
            не пересказывай всё сказанное.
    next_state: Formulating

  interject_keep_listening:
    enabled: true
    description: "LLM решила не вмешиваться — слушаем дальше, таймер НЕ сбрасываем (FR-08)"
    entry_states: [DecidingInterject]
    priority: 40
    when:
      all:
        - not interject_accepted
    actions:
      - action: noop
    next_state: Listening

  # ═══════════════════════════════════════════════════════════════════════════
  # DecidingBargeIn — собеседник говорит поверх нас дольше порога
  # ═══════════════════════════════════════════════════════════════════════════

  bargein_yield:
    enabled: true
    description: "Собеседник действительно перебивает — уступаем, но ответ коммитим (FR-16)"
    entry_states: [DecidingBargeIn]
    priority: 50
    when:
      all:
        - bargein_accepted
    actions:
      - action: commit_partial
    next_state: Listening

  bargein_continue:
    enabled: true
    description: "Поддакивание, а не перебивание — договариваем"
    entry_states: [DecidingBargeIn]
    priority: 40
    when:
      all:
        - not bargein_accepted
    actions:
      - action: resume_speaking
    next_state: Speaking

  # ═══════════════════════════════════════════════════════════════════════════
  # Closing — прощание играет
  # ═══════════════════════════════════════════════════════════════════════════

  late_question:
    enabled: true
    description: "Собеседник заговорил во время прощания — завершение отменяется (FR-26)"
    entry_states: [Closing]
    priority: 90
    actions:
      - action: noop
    next_state: Listening

  # ═══════════════════════════════════════════════════════════════════════════
  # Ошибки — допустимы в нескольких состояниях
  # ═══════════════════════════════════════════════════════════════════════════

  service_unavailable:
    enabled: true
    description: "LLM или RAG недоступны — говорим честно, не молчим в трубку"
    entry_states: [Listening, Formulating, Speaking]
    priority: 100
    when:
      any:
        - error.type == "timeout"
        - error.type == "connection_refused"
        - error.type == "server_error"
    actions:
      - action: say
        params:
          text: "Простите, у меня сейчас сбой. Повторите, пожалуйста, вопрос."
    next_state: Listening

# ─────────────────────────────────────────────────────────────────────────────
# Подстановки, не зависящие от диалога
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  phone: "+7 (XXX) XXX-XX-XX"   # ← заменить на реальный телефон приёмной комиссии

# ─────────────────────────────────────────────────────────────────────────────
# Пороги живут в .env, здесь только справочно — код читает их из конфига,
# а не отсюда. Дублирование значений сюда запрещено, чтобы они не разъехались.
#
#   DIALOGUE_INTERJECT_AFTER_S     сколько непрерывной речи до решения вмешаться
#   DIALOGUE_IDLE_HANGUP_S         сколько тишины после ответа до прощания
#   DIALOGUE_BARGE_IN_OVERLAP_S    сколько одновременной речи до решения о перебивании
#   DIALOGUE_BARGE_IN_MIN_TAIL_S   сколько нашего аудио должно остаться, чтобы решать
#
# Порог уверенности для уточнения в этот список НЕ входит: он живёт литералом в
# `when:` сценария clarify_unclear, потому что относится к поведению диалога, а не
# к таймингам автомата. Правится там же, где и остальная логика сценария.
# ─────────────────────────────────────────────────────────────────────────────
