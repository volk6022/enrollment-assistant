[project]
name = "experiment-tts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "transformers>=4.45.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "piper-tts>=1.2.0",
    "tabulate>=0.9.0",
    "scipy>=1.13.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
kokoro = [
    "kokoro>=0.9.0",
]
edge = [
    "edge-tts>=6.1.0",
    "gTTS>=2.5.0",
]
grid = [
    "ruaccent>=1.5.0",
    "librosa>=0.10.0",
]
denoise = [
    # NOTE: deepfilternet depends on `deepfilterlib`, a Rust extension with no
    # Windows wheel — it fails to build here (needs Rust + maturin). Install and
    # run the `dfn` denoise axis on the Linux VPS/prod side, not this laptop.
    "deepfilternet>=0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models"]

[tool.uv]
dev-dependencies = [
    "ipython>=8.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
